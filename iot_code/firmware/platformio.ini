; HRC Safety Log – firmware ESP32 DevKit V1 (ESP32-WROOM-32)
; Build:   pio run                 (trong thư mục iot_code/firmware)
; Nạp:     pio run -t upload
; Serial:  pio device monitor
; Trước khi build: copy include/secrets.h.example -> include/secrets.h và điền giá trị.

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
    -DARDUINOJSON_USE_LONG_LONG=1    ; nonce/seq/ts_ms là số 64 bit
; Cảnh báo đầy đủ CHỈ cho code của nhóm (không áp cho core/thư viện)
build_src_flags = -Wall -Wextra
lib_deps =
    knolleary/PubSubClient @ 2.8
    bblanchon/ArduinoJson @ 7.4.3
    madhephaestus/ESP32Servo @ 3.2.1
; Cảm biến HC-SR04 đọc bằng GPIO thuần (không cần thư viện) – xem us_measure() trong src/main.cpp

; Thử fast lane trên bàn KHÔNG cần WiFi/MQTT (mất kết nối không ngắt relay). KHÔNG dùng khi demo chính thức.
;   pio run -e esp32dev_bench -t upload
[env:esp32dev_bench]
extends = env:esp32dev
build_flags =
    ${env:esp32dev.build_flags}
    -DHRC_REQUIRE_LINK=0
