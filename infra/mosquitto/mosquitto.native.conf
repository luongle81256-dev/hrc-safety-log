# Mosquitto 2.x – cấu hình DỰ PHÒNG khi chạy native (không có Docker)
# Chạy (PowerShell, tại thư mục gốc repo):
#   & "C:\Program Files\mosquitto\mosquitto.exe" -c infra\mosquitto\mosquitto.native.conf -v
# Lưu ý: trên Windows, bản cài native có thể đã tự chạy dạng service trên cổng 1883
# (chỉ nghe localhost). Dừng service đó trước:  net stop mosquitto  (PowerShell Admin)

persistence false
log_dest stdout
connection_messages true

listener 1883
allow_anonymous true
