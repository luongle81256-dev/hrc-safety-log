# Mosquitto 2.x – cấu hình DEV cho đồ án (dùng trong Docker)
#
# LƯU Ý BẢO MẬT: allow_anonymous true chỉ dùng cho môi trường lab.
# Tính toàn vẹn/xác thực nguồn dữ liệu được đảm bảo ở tầng ứng dụng bằng HMAC-SHA256
# (xem docs/INTERFACES.md). Hướng nâng cấp: password_file + TLS (listener 8883).

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true

# Mosquitto 2.x mặc định chỉ nghe localhost nếu không khai báo listener.
# Khai báo listener 1883 => nghe mọi interface (cần để ESP32 trong LAN kết nối).
listener 1883
allow_anonymous true
